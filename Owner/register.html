<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G5 Laptop - Đăng ký</title>
    <link rel="stylesheet" href="/Asset/Css/Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <body>

        <div id="header"></div>

        <script src="../Asset/Js/header.js"></script>

    </body>

    <!-- FORM ĐĂNG KÝ -->
    <section class="form-container">
        <h2>Đăng Ký</h2>

        <form id="registerForm">

            <label>Họ Tên</label>
            <input name="fullname" type="text" placeholder="Nhập họ tên" required>

            <label>SĐT</label>
            <input name="phone" type="text" placeholder="Nhập SĐT..." required>

            <label>Địa Chỉ</label>
            <input name="address1" type="text" placeholder="Nhập Đường/Thôn...">
            <input name="address2" type="text" placeholder="Nhập Phường/Quận...">
            <input name="address3" type="text" placeholder="Nhập Tỉnh/Thành phố...">

            <label>Email</label>
            <input name="email" type="email" placeholder="Nhập Email" required>

            <label class="label-gender">Giới Tính</label>
            <div class="gender-group">
                <label><input name="gender" type="radio" value="Nam" required> Nam</label>
                <label><input name="gender" type="radio" value="Nữ"> Nữ</label>
            </div>

            <label>Mật khẩu</label>
            <div class="login-input-group">
                <input name="password" id="password" type="password" placeholder="Nhập mật khẩu" required>
                <i class="fa-solid fa-eye" id="eye"></i>
            </div>

            <label>Nhập lại mật khẩu</label>
            <div class="login-input-group">
                <input name="repassword" id="password2" type="password" placeholder="Nhập lại mật khẩu" required>
                <i class="fa-solid fa-eye" id="eye2"></i>
            </div>

            <button class="btn-submit" type="submit">Đăng ký</button>

        </form>
    </section>

    <script src="/Asset/Js/owner_register.js"></script>
</body>

</html>
