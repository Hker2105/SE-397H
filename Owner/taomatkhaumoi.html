<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo mật khẩu mới</title>
    <link rel="stylesheet" href="/Asset/Css/quenmatkhau.css">
</head>
<body>

    <div class="auth-container">
        <h2 class="auth-title">Tạo mật khẩu mới</h2>
        <p class="auth-desc">Mật khẩu mới phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="new-password">Nhập mật khẩu mới</label>
                <input type="password" id="new-password" name="new-password" placeholder="Nhập mật khẩu mới..." required>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Nhập lại mật khẩu mới..." required>
            </div>
            
            <button type="submit" class="btn-submit">Đổi mật khẩu</button>
        </form>

        <div class="auth-links">
            <a href="/Owner/login.html">Hủy bỏ</a>
        </div>
    </div>

</body>
</html>
