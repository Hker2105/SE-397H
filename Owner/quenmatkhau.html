<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="/Asset/Css/quenmatkhau.css">
</head>
<body>

    <div class="auth-container">
        <h2 class="auth-title">Quên mật khẩu</h2>
        <p class="auth-desc">Nhập email hoặc số điện thoại đã đăng ký để khôi phục mật khẩu.</p>
        
        <form action="taomatkhaumoi.html" method="GET">
            <div class="form-group">
                <label for="contact">Email hoặc Số điện thoại</label>
                <input type="text" id="contact" name="contact" placeholder="Nhập email hoặc số điện thoại..." required>
            </div>
            
            <button type="submit" class="btn-submit">Tiếp tục</button>
        </form>

        <div class="auth-links">
            <a href="#">Quay lại Đăng nhập</a>
        </div>
    </div>

</body>
</html>
