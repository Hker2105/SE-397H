<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - G5 LAPTOP</title>
    <link rel="stylesheet" href="/Asset/Css/style.css">
    <link rel="stylesheet" href="/Asset/Css/sanphamcuahang.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="header"></div>

    <div class="page-title-banner">
        <h2>SẢN PHẨM CỦA CỬA HÀNG</h2>
    </div>

    <main class="main-content container layout-flex">
        
        <aside class="sidebar">
            <h3 class="sidebar-title">Lọc theo giá</h3>
            <ul class="filter-list">
                <li><label><input type="radio" name="price-filter" value="all" checked> Tất cả</label></li>
                <li><label><input type="radio" name="price-filter" value="under-5"> Dưới 5.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="5-10"> 5.000.000-10.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="10-20"> 10.000.000-20.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="20-30"> 20.000.000-30.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="over-30"> Trên 30.000.000</label></li>
            </ul>
            <button class="btn-filter">Lọc</button>
        </aside>

        <section class="new-products">
            <div class="product-grid"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="/Asset/Js/header.js"></script>
    <script src="/Asset/Js/footer.js"></script>
    <script src="/Asset/Js/owner_products.js"></script>
</body>
</html>
