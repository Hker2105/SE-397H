<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - G5 LAPTOP</title>
    <link rel="stylesheet" href="/Asset/Css/sanphamcuahang.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <div class="logo">G5 LAPTOP</div>
            
            <div class="search-box">
                <input type="text" placeholder="Tìm Kiếm Sản Phẩm">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <div class="header-icons">
                <div class="icon-item">
                    <i class="fas fa-heart" style="color: #00e5ff;"></i> <span>0</span>
                </div>
                <div class="icon-item">
                    <i class="fas fa-shopping-cart" style="color: #00e5ff;"></i> <span>0</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="container nav-inner">
            <div class="category-wrapper">
                <div class="category-btn">
                    <span>Danh mục sản phẩm</span>
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </div>
                <ul class="category-list">
                    <li><a href="#">Laptop Asus</a></li>
                    <li><a href="#">Laptop Dell</a></li>
                    <li><a href="#">MacBook</a></li>
                </ul>
            </div>

            <ul class="main-menu">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="/Owner/sanphamcuahang.html">Sản phẩm</a></li>
                <li><a href="/Owner/cart.html">Giỏ hàng</a></li>
                <li><a href="update_info.html">Tài khoản</a></li>
                <li><a href="#">Quản lý lịch sử đơn hàng</a></li>
            </ul>

            <div class="auth-links">
                <a href="login.html">Thoát</a>
            </div>
        </div>
    </nav>

    <div class="page-title-banner">
        <h2>SẢN PHẨM CỦA CỬA HÀNG</h2>
    </div>

    <main class="main-content container layout-flex">
        
        <aside class="sidebar">
            <h3 class="sidebar-title">Lọc theo giá</h3>
            <ul class="filter-list">
                <li><label><input type="radio" name="price-filter" value="all" checked> Tất cả</label></li>
                <li><label><input type="radio" name="price-filter" value="under-5"> Dưới 5.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="5-10"> 5.000.000-10.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="10-20"> 10.000.000-20.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="20-30"> 20.000.000-30.000.000</label></li>
                <li><label><input type="radio" name="price-filter" value="over-30"> Trên 30.000.000</label></li>
            </ul>
            <button class="btn-filter">Lọc</button>
        </aside>

        <section class="new-products">
            <div class="product-grid"></div>
        </section>
    </main>

    <script src="/Asset/Js/owner_products.js"></script>
</body>
</html>
