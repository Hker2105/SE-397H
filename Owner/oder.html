<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G5 Laptop - Đặt hàng</title>
    <link rel="stylesheet" href="/Asset/Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
        <div id="header"></div>

        <script src="/Asset/Js/header.js"></script>

    <!-- ORDER -->
    <section class="order-header">
        <h1>ĐẶT HÀNG</h1>
        <p><a href="#">Trang chủ</a> - Đặt hàng</p>
    </section>

    <section class="order-container">

        <div class="order-left">
            <h2>Thông tin người đặt hàng</h2>

            <div class="order-grid">
                <div>
                    <input type="text" placeholder="Họ và tên">
                </div>

                <div>
                    <input type="text" placeholder="Số điện thoại">
                </div>

                <div>
                    <input type="email" placeholder="Email">
                </div>

                <div>
                    <input type="text" placeholder="Địa chỉ">
                </div>

                <div style="grid-column: span 2;">
                    <input type="text" placeholder="Ghi chú">
                </div>
            </div>
        </div>

        <div class="order-right">
            <div class="invoice-box">
                <div class="invoice-title">Tổng hóa đơn</div>

                <div class="invoice-item invoice-line" id="order-products"><strong>Sản phẩm: --</strong></div>

                <div class="invoice-item" id="order-subtotal"><strong>Thành tiền: --</strong></div>

                <div class="invoice-item" id="order-shipping"><strong>Phí vận chuyển: --</strong></div>

                <div class="invoice-item">
                    <strong>Phương thức thanh toán</strong>
                    <select id="order-payment-method" style="margin-top:8px; width:100%; padding:8px;">
                        <option value="">-- Chọn phương thức --</option>
                        <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                        <option value="BANK">Chuyển khoản ngân hàng</option>
                        <option value="MOMO">Ví điện tử (Momo/ZaloPay)</option>
                        <option value="CARD">Thẻ tín dụng/Ghi nợ</option>
                    </select>
                </div>

                <button class="order-btn">Đặt Hàng</button>
            </div>
        </div>

    </section>
    <script src="/Asset/Js/oder.js"></script>
</body>

</html>
