<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G5 Laptop - Đăng Nhập</title>
    <link rel="stylesheet" href="/Asset/Css/Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="top-right-nav">
        <a href="register.html" class="nav-btn nav-register-btn">Đăng ký</a>
        <a href="login.html" class="nav-btn nav-login-btn">Đăng nhập</a>
    </div>
    
    <div class="login-page">

        <div class="login-box">
            <h1 class="login-title">ĐĂNG NHẬP</h1>

            <div class="login-input-group">
                <input type="text" placeholder="Nhập email">
            </div>

            <div class="login-input-group">
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <i class="fa-solid fa-eye" id="eye"></i>
            </div>

            <div class="login-captcha-group">
                <input type="text" placeholder="Mã xác nhận">
                <button class="login-captcha-btn"></button>
            </div>

            <div class="login-remember-group">
    <div class="remember-me-checkbox">
        <input type="checkbox" id="remember">
        <label for="remember">Nhớ đăng nhập lần sau</label>
    </div>
    <a href="/Owner/quenmatkhau.html" class="forgot-password-link">Quên mật khẩu</a>
</div>


            <button class="login-btn">Đăng nhập</button>

            <a href="register.html" class="login-create-account">Tạo tài khoản mới</a>
        </div>
    </div>
    <script src="/Asset/Js/owner_login.js"></script>
</body>
</html>
